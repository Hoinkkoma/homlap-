<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <style>
    .box { fill:#f7f9fb; stroke:#2b7da3; stroke-width:2; rx:8; }
    .host { fill:#ffffff; stroke:#4a5568; stroke-width:1.5; rx:6; }
    .title { font: bold 18px sans-serif; fill:#0b3b4a }
    .label { font: 14px sans-serif; fill:#1f2937 }
    .small { font: 12px sans-serif; fill:#374151 }
    .arrow { stroke:#0b3b4a; stroke-width:2; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0b3b4a" />
    </marker>
  </defs>

  <!-- Internet / Router -->
  <rect x="480" y="20" width="240" height="64" class="box" />
  <text x="600" y="48" class="title" text-anchor="middle">Router / Edge</text>
  <text x="600" y="66" class="small" text-anchor="middle">DHCP, DNS (Pi-hole), NAT</text>

  <!-- Left: Debian Monitoring -->
  <rect x="80" y="140" width="320" height="160" class="box" />
  <text x="240" y="172" class="title" text-anchor="middle">Debian Monitoring</text>
  <text x="240" y="196" class="label" text-anchor="middle">Prometheus, Grafana, Loki</text>
  <text x="240" y="216" class="small" text-anchor="middle">Uptime / Scrutiny / Homepage</text>

  <!-- Right: Proxmox Host -->
  <rect x="760" y="140" width="320" height="420" class="box" />
  <text x="920" y="172" class="title" text-anchor="middle">Proxmox Host</text>
  <text x="920" y="198" class="label" text-anchor="middle">VMs, LXC, Docker</text>

  <!-- Proxmox - VMs area -->
  <rect x="800" y="220" width="240" height="120" class="host" />
  <text x="920" y="248" class="label" text-anchor="middle">print-vm</text>
  <text x="920" y="268" class="small" text-anchor="middle">Debian • CUPS • HPLIP • Avahi</text>

  <rect x="800" y="360" width="240" height="120" class="host" />
  <text x="920" y="388" class="label" text-anchor="middle">Other VMs</text>
  <text x="920" y="408" class="small" text-anchor="middle">Jellyfin, Forgejo, etc.</text>

  <!-- Digitus and Printer -->
  <rect x="440" y="420" width="220" height="80" class="host" />
  <text x="550" y="448" class="label" text-anchor="middle">Digitus Printserver</text>
  <text x="550" y="468" class="small" text-anchor="middle">Network Printserver (JetDirect / LPD / IPP)</text>

  <rect x="440" y="520" width="140" height="64" class="host" />
  <text x="510" y="552" class="label" text-anchor="middle">HP OfficeJet 4558</text>
  <text x="510" y="568" class="small" text-anchor="middle">USB-connected</text>

  <!-- Connections: Router to Monitoring and Proxmox -->
  <path d="M600,84 L240,140" class="arrow" />
  <path d="M720,84 L920,140" class="arrow" />

  <!-- Connection: print-vm to Digitus -->
  <path d="M920,260 L660,420" class="arrow" />
  <text x="800" y="320" class="small" text-anchor="middle">LAN (hostname / service discovery)</text>

  <!-- Connection: Digitus to HP (USB) -->
  <path d="M550,500 L550,520" stroke="#0b3b4a" stroke-width="2" />

  <!-- Connection: Homepage -> print-vm -->
  <path d="M240,260 L920,240" class="arrow" />
  <text x="540" y="232" class="small" text-anchor="middle">Homepage App → IPP/LPD → print-vm</text>

  <!-- Legend -->
  <rect x="40" y="620" width="320" height="140" rx="8" fill="#fff" stroke="#e2e8f0" />
  <text x="80" y="650" class="title">Legende</text>
  <text x="80" y="674" class="small">• Router / Edge: DHCP, DNS</text>
  <text x="80" y="692" class="small">• Debian Monitoring: Observability</text>
  <text x="80" y="710" class="small">• Proxmox Host: Virtualization</text>
  <text x="80" y="728" class="small">• print-vm: CUPS/HPLIP (hostname-based)</text>
  <text x="80" y="746" class="small">• Digitus: Network Printserver (no IPs shown)</text>

</svg>
